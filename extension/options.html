<!doctype html><html><head><meta charset="utf-8"><title>ATS Apply Helper – settings</title>
<style>body{font:14px system-ui;margin:20px;max-width:900px} textarea{width:100%;height:50vh;font:12px monospace} button{margin-right:8px;padding:6px 12px} .row{margin:10px 0}</style></head>
<body>
<h2>ATS Apply Helper</h2>
<div class="row"><label><input type="checkbox" id="autoNext"> Auto-click Next / Save and Continue when a page has no required unknown questions and no errors (never clicks Submit)</label></div>
<div class="row"><label><input type="checkbox" id="autofill"> Workday: prefer "Autofill with Resume" over "Apply Manually"</label></div>
<h3>Learned answers (editable JSON; tried before profile.json rules)</h3>
<textarea id="learned"></textarea>
<div class="row">
  <button id="save">Save</button>
  <button id="export">Export full bank (learned + profile)</button>
  <button id="reseed">Reload profile.json from the extension folder</button>
</div>
<p id="msg"></p>
<script src="options.js"></script></body></html>
